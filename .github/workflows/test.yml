name: test

on:
  push:
    branches: ["**"] # every branch, no tags
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      # The channel layer is channels_redis.pubsub; the cancel test publishes through it.
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r ../requirements.txt
      - run: pip install ruff==0.17.3 # separate: the lock is hash-checked, ruff isn't in it
      - run: ruff check .
      # No DEBUG here: `manage.py test` selects lukehirsch.test_settings, which sets it itself.
      # --skip llm: the live prompt tests need ollama / the tower answering.
      - run: python manage.py test --skip llm --parallel auto

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -p tests/tsconfig.json --noEmit # tsc -b leaves the test tree out
      - run: npm run build # tsc -b && vite build
      - run: npm test # vitest, node env
