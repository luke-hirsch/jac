<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>{{ title }}</title>
    <style>
      :root {
        --bg: #fafafa;
        --fg: #18181b;
        --muted: #71717a;
        --border: #e4e4e7;
        --accent: #4f46e5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --fg: #fafafa;
          --muted: #a1a1aa;
          --border: #27272a;
          --accent: #818cf8;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      main {
        max-width: 42rem;
        margin: 0 auto;
        padding: 2rem 1rem;
      }
      h1 {
        font-size: 1.6rem;
        line-height: 1.25;
      }
      h2 {
        font-size: 1.1rem;
        margin-top: 2rem;
      }
      a {
        color: var(--accent);
        overflow-wrap: anywhere;
      }
      address {
        font-style: normal;
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.9rem;
      }
      th,
      td {
        border: 1px solid var(--border);
        padding: 0.4rem 0.6rem;
        text-align: left;
        vertical-align: top;
      }
      .warn {
        color: #b91c1c;
        font-weight: 600;
      }
      footer.legal {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1rem;
        justify-content: center;
        padding: 1.5rem 1rem;
        font-size: 0.8rem;
      }
      footer.legal a {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <p><a href="/">← zurück</a></p>
      <h1>{{ title }}</h1>
      {% block content %}{% endblock %}
    </main>
    {% include "spa/_legal_footer.html" %}
  </body>
</html>
