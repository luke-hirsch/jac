<!doctype html>
<html lang="en">
  <head>
    <!-- nginx fills this in at run time (deploy/image/spa.inc); lib/host.ts reads it. -->
    <meta name="jac-base-domain" content="__BASE_DOMAIN__" />
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lukehirsch</title>
    <script>
      // Pre-paint: a React effect runs after the first frame, which is a white flash on
      // every load in dark mode, and a flash of the fallback colour before the brand arrives.
      // Hand-inlined mirror of lib/appearance.ts themeClasses() and lib/brand.ts
      // rememberedBrand(): change one, change the other (tests/lib/_pre-paint.ts runs this).
      // A storage that throws (a private window) still gets the system's light or dark.
      (function () {
        var root = document.documentElement;
        var a = {};
        try {
          a = JSON.parse(localStorage.getItem("appearance") || "{}") || {};
        } catch (e) {}
        var dark =
          a.theme === "dark" ||
          (a.theme !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        root.classList.add(dark ? "dark" : "light");
        if (a.contrast === "high") root.classList.add("contrast-high");
        try {
          var brand = localStorage.getItem("brand") || "";
          if (/^#[0-9a-f]{6}$/.test(brand))
            root.style.setProperty("--brand", brand);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
