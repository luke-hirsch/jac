# Laptop only: lets a browser reach the stack over plain http. Never copy this to the mini: it turns
# DEBUG on. Compose merges this file on its own; its values beat config/.env.
x-laptop: &laptop
  environment:
    DEBUG: "1"
    BASE_DOMAIN: localhost
    REDIS_URL: redis://host.docker.internal:6379/1
    HIRSCHAI_URL: http://host.docker.internal:11434

services:
  web:
    <<: *laptop
    ports: ["127.0.0.1:8000:8000"]
  app: *laptop
  worker-ai: *laptop
  worker-cloud: *laptop
  worker-quick: *laptop
  worker-mail: *laptop
